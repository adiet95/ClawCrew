apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: clawcrew
  namespace: clawcrew
  labels:
    app.kubernetes.io/name: clawcrew
    app.kubernetes.io/part-of: clawcrew
spec:
  to:
    kind: Service
    name: clawcrew
    weight: 100
  port:
    targetPort: gateway
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
